<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hurup Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- PDF.js v3 exposes the pdfjsLib global used below. v4's .mjs needs an ES module import. -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <style>
    :root { --brand-color:#f55036; }
    html,body { height:100%; margin:0; }
    body { overflow:hidden; }
    #main-container { height:100vh; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
    #chat-scroll-area { overflow-y:auto; min-height:0; scroll-behavior:smooth; }
    #chat { overflow-wrap:anywhere; }
    #image-preview-container { max-height:116px; overflow-y:auto; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:#adb5bd; border-radius:4px; }
    [data-bs-theme="dark"] ::-webkit-scrollbar-thumb { background:#495057; }
    .msg-user { background:var(--bs-secondary-bg); border:1px solid var(--bs-border-color); border-radius:1rem 1rem 1rem 0; padding:1rem; }
    .avatar { width:32px; height:32px; min-width:32px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--bs-border-color); }
    .robot { color:var(--brand-color); }
    pre { background:var(--bs-tertiary-bg); border:1px solid var(--bs-border-color); border-radius:.5rem; padding:1rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-in-up { animation:fadeIn .25s ease-out both; }
    #game-overlay { background:#0f172a; z-index:1050; }
    #gameCanvas { touch-action:none; cursor:grab; }
    #gameCanvas:active { cursor:grabbing; }
    #camera-overlay { background:black; z-index:1060; }
    #camera-video { width:100%; height:100%; object-fit:cover; }
    .cam-btn { width:56px; height:56px; border-radius:50%; border:0; display:grid; place-items:center; font-size:1.3rem; }
    .cam-btn:active { transform:scale(.93); }
    .cam-shutter { width:72px; height:72px; background:white; border:4px solid #ffffff80; box-shadow:0 0 0 4px #ffffff33; }
    .flag-pill { position:absolute; background:linear-gradient(#fff,#f6faff); border:3px solid #0d47a1d9; border-radius:10px; box-shadow:0 4px 6px #0003; padding:4px 8px; white-space:nowrap; pointer-events:none; transform-origin:center; z-index:20; font-size:10px; font-weight:700; color:#0b2a6e; max-width:140px; overflow:hidden; text-overflow:ellipsis; }
    #game-q-panel { max-width:min(320px,calc(100vw - 96px)); }
    .attachment { position:relative; flex:0 0 auto; max-width:150px; }
    .attachment img { width:auto; max-width:130px; height:66px; object-fit:contain; }
    .attachment .remove { position:absolute; top:-6px; right:-6px; border-radius:50%; width:22px; height:22px; padding:0; line-height:1; }
    .attachment-name { display:block; max-width:130px; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
    .app-footer { padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px)) !important; }
    .toast-container { z-index:1100; }
  </style>
</head>
<body class="bg-body">
<div id="main-container" class="container-md p-0 mx-auto">
  <header class="border-bottom bg-body p-3">
    <div class="d-flex align-items-center justify-content-between gap-2">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-cpu-fill fs-4" style="color:var(--brand-color)"></i>
        <div>
          <h1 class="h6 fw-bold mb-0">Hurup Generator</h1>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button id="btn-theme" class="btn btn-outline-secondary btn-sm" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>

  <main id="chat-scroll-area" class="p-3"><div id="chat" class="d-flex flex-column gap-4"></div></main>

        <button id="btn-attach" class="btn btn-outline-secondary" title="Attach Image or PDF"><i class="bi bi-paperclip"></i></button>

        <textarea id="input" rows="1" class="form-control border-0 shadow-none" style="resize:none;max-height:110px" placeholder="Type a topic or attach study material"></textarea>

<!-- Wheel preview -->

  <button id="game-close" class="position-absolute top-0 end-0 m-3 btn btn-light rounded-circle z-3" title="Close wheel"><i class="bi bi-x-lg"></i></button>
  <div class="position-relative w-100 h-100 overflow-hidden">

    <div class="position-absolute top-0 start-0 w-100 h-100 pe-none user-select-none">
      <div id="game-flags-container" class="position-absolute w-100 h-100 opacity-0"></div>
      <div id="game-selection-box" class="position-absolute border border-2 rounded-pill shadow-lg d-none" style="background:#ffffff11;border-color:#ffffff99!important"></div>
      <div id="game-q-panel" class="position-absolute top-0 start-0 m-3 p-3 rounded bg-white text-dark shadow pe-auto border">
        <div id="game-q-text" class="fw-bold small mb-2">Drag the wheel to spin...</div>
        <div id="game-a-text" class="small text-success fw-semibold d-none"><span class="text-muted">Answer: </span><span id="game-a-value"></span></div>

<!-- Camera -->

  <video id="camera-video" class="position-absolute top-0 start-0" autoplay playsinline muted></video>
  <div class="position-absolute top-0 start-0 w-100 d-flex justify-content-between p-3">

<!-- Message templates -->
<template id="tpl-user">
  <div class="d-flex gap-3 fade-in-up"><div class="avatar bg-secondary-subtle"><i class="bi bi-person-fill"></i></div><div class="flex-grow-1"><div class="msg-user"><div class="msg-content text-break"></div></div></div></div>
</template>
<template id="tpl-table">
  <div class="d-flex gap-3 fade-in-up"><div class="avatar robot bg-body"><i class="bi bi-robot"></i></div>
    <div class="flex-grow-1 overflow-hidden" style="min-width:0"><div class="card shadow-sm">
      <div class="table-responsive" style="max-height:500px"><table class="table table-hover table-striped mb-0 small"><thead class="table-light sticky-top"><tr><th>#</th><th>Keyword</th><th>Question</th><th>Answer</th></tr></thead><tbody></tbody></table></div>
      <div class="card-footer bg-body-tertiary d-flex gap-2"><button class="btn-copy btn btn-sm btn-outline-secondary"><i class="bi bi-clipboard"></i> Copy RAW</button><button class="btn-download btn btn-sm btn-outline-secondary"><i class="bi bi-download"></i> .txt</button></div>
    </div></div>
  </div>
</template>
<template id="tpl-json">
  <div class="d-flex gap-3 fade-in-up"><div class="avatar robot bg-body"><i class="bi bi-code-slash"></i></div>
    <div class="flex-grow-1 overflow-hidden" style="min-width:0"><div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between py-2"><span class="small fw-bold text-muted">Wheel JSON</span><span class="badge bg-success-subtle text-success border border-success-subtle">Validated</span></div>
      <div class="card-body p-0"><pre class="m-0 rounded-0 border-0" style="max-height:300px;overflow:auto"><code class="small" data-json></code></pre></div>
      <div class="card-footer bg-body-tertiary d-flex flex-wrap gap-2"><button class="btn-play btn btn-sm btn-outline-primary"><i class="bi bi-controller"></i> Play</button><button class="btn-preview btn btn-sm btn-outline-success"><i class="bi bi-eye-fill"></i> Wheel Preview</button><button class="btn-copy-json btn btn-sm btn-outline-secondary"><i class="bi bi-clipboard"></i> Copy JSON</button></div>
    </div></div>
  </div>
</template>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="liveToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="polite"><div class="d-flex"><div class="toast-body" id="toast-msg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

/* =================== CONFIG =================== */
const CLOUDFLARE_AI_URL = 'https://hurup-groq-proxy.nkrash91.workers.dev';
const MODEL = 'gpt-oss-120b';
const STORAGE_KEY = 'HURUP_DEV_OVERRIDE_DATA';
const TSV_HEADER = '#\tKeyword\tFull Question\tAnswer';
const $ = selector => document.querySelector(selector);
const chat = $('#chat');
const bsToast = bootstrap.Toast.getOrCreateInstance($('#liveToast'));
const showToast = msg => { $('#toast-msg').textContent = msg; bsToast.show(); };
const scrollChat = () => { $('#chat-scroll-area').scrollTop = $('#chat-scroll-area').scrollHeight; };
const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

/* =================== CHAT RENDERING =================== */
function renderUser(message) {
  const node = $('#tpl-user').content.firstElementChild.cloneNode(true);
  node.querySelector('.msg-content').textContent = message;
  chat.appendChild(node); scrollChat();
}
function renderThinking(message) {
  clearThinking();
  const node = document.createElement('div');
  node.dataset.thinking = '1';
  node.className = 'd-flex align-items-center justify-content-center py-4 text-muted fade-in-up';
  node.innerHTML = '<div class="spinner-border spinner-border-sm me-2" role="status"></div><span class="small fst-italic" data-thinking-text></span>';
  node.querySelector('[data-thinking-text]').textContent = message;
  chat.appendChild(node); scrollChat();
}
function updateThinkingText(message) { const el = $('[data-thinking-text]'); if (el) el.textContent = message; }
function clearThinking() { chat.querySelectorAll('[data-thinking="1"]').forEach(node => node.remove()); }
function renderError(message) {
  const node = document.createElement('div'); node.className = 'alert alert-danger small fade-in-up';
  node.textContent = 'Generation Error: ' + message; chat.appendChild(node); scrollChat();
}
function renderTable(rows) {
  const node = $('#tpl-table').content.firstElementChild.cloneNode(true);
  const tbody = node.querySelector('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((value, index) => {
      const td = document.createElement('td'); td.textContent = value;
      if (index === 1) td.className = 'font-monospace text-primary';
      if (index === 3) td.classList.add('fw-bold');
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  const tsv = TSV_HEADER + '\n' + rows.map(r => r.join('\t')).join('\n');
  node.querySelector('.btn-copy').onclick = async () => {
    try { await navigator.clipboard.writeText(tsv); showToast('TSV copied'); }
    catch { showToast('Clipboard unavailable: use the .txt download'); }
  };
  node.querySelector('.btn-download').onclick = () => downloadText('hurup-qa.txt',tsv,'text/plain;charset=utf-8');
  chat.appendChild(node); scrollChat();
}
function downloadText(name,text,mime) {
  const url = URL.createObjectURL(new Blob([text], {type:mime}));
  const anchor = document.createElement('a'); anchor.href = url; anchor.download = name;
  document.body.appendChild(anchor); anchor.click(); anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function renderJSON(obj) {
  const node = $('#tpl-json').content.firstElementChild.cloneNode(true);
  const content = JSON.stringify(obj,null,2);
  node.querySelector('[data-json]').textContent = content;
  node.querySelector('.btn-preview').onclick = () => launchGame(obj);
  node.querySelector('.btn-copy-json').onclick = async () => {
    try { await navigator.clipboard.writeText(content); showToast('JSON copied'); }
    catch { showToast('Clipboard unavailable'); }
  };
  node.querySelector('.btn-play').onclick = () => {
    try {
      localStorage.setItem(STORAGE_KEY,content);
      showToast('Opening GearQuiz with custom data');
      const url = 'dist/index.html';
      const win = window.open(url,'_blank');
      if (!win) window.location.href = url;
    } catch (error) { renderError('Unable to save game data: ' + error.message); }
  };
  chat.appendChild(node); scrollChat();
}

/* =================== FILES AND CAMERA =================== */
let attachments = []; // {type:'image',dataUrl,label} OR {type:'pdf',file,label}
let cameraStream = null;
let cameraFacingMode = 'environment';
let flashOn = false;
let generating = false;
function renderAttachmentPreviews() {
  const parent = $('#image-preview-container'); parent.replaceChildren();
  parent.classList.toggle('d-none',attachments.length === 0);
  attachments.forEach((item,index) => {
    const wrap = document.createElement('div'); wrap.className = 'attachment border rounded p-1 bg-body-secondary';
    if (item.type === 'image') {
      const img = document.createElement('img'); img.src = item.dataUrl; img.alt = item.label;
      wrap.appendChild(img);
    } else {
      const icon = document.createElement('div'); icon.className = 'text-center py-2 text-danger';
      icon.innerHTML = '<i class="bi bi-file-earmark-pdf-fill fs-2"></i>'; wrap.appendChild(icon);
    }
    const label = document.createElement('span'); label.className = 'attachment-name small';
    label.textContent = item.label; wrap.appendChild(label);
    const remove = document.createElement('button'); remove.className = 'remove btn btn-danger btn-sm';
    remove.type = 'button'; remove.innerHTML = '<i class="bi bi-x"></i>';
    remove.onclick = () => { if (!generating) { attachments.splice(index,1); renderAttachmentPreviews(); } };
    wrap.appendChild(remove); parent.appendChild(wrap);
  });
}
function compressImage(src) {
  return new Promise((resolve,reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1,Math.round(img.naturalWidth*scale));
      canvas.height = Math.max(1,Math.round(img.naturalHeight*scale));
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',.85));
    };
    img.onerror = () => reject(new Error('Could not decode image'));
    img.src = src;
  });
}
async function addImageFromFile(file) {
  const src = await new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Cannot read file'));
    reader.readAsDataURL(file);
  });
  attachments.push({type:'image',dataUrl:await compressImage(src),label:file.name});
  renderAttachmentPreviews();
}
$('#btn-attach').onclick = () => $('#file-input').click();
$('#file-input').onchange = async event => {
  const selected = Array.from(event.target.files ?? []);
  for (const file of selected) {
    try {
      if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        attachments.push({type:'pdf',file,label:file.name}); renderAttachmentPreviews();
      } else if (file.type.startsWith('image/')) {
        await addImageFromFile(file);
      } else showToast('Unsupported file: ' + file.name);
    } catch (error) { showToast('Cannot attach ' + file.name + ': ' + error.message); }
  }
  event.target.value = '';
};
async function extractTextFromImage(dataUrl) {
  if (typeof Tesseract === 'undefined') throw new Error('Tesseract.js did not load.');
  const result = await Tesseract.recognize(dataUrl,'eng',{
    logger: m => {
      if (m.status === 'recognizing text') updateThinkingText('OCR reading image... ' + Math.round(100*m.progress) + '%');
    }
  });
  return (result.data.text || '').trim();
}
async function extractTextFromPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js did not load. Check your internet connection.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({data}).promise;
  const texts = [];
  const pages = Math.min(pdf.numPages,10);
  for (let i=1; i<=pages; i++) {
    updateThinkingText(`Reading PDF page ${i}/${pages}...`);
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    let text = textContent.items.map(item => item.str || '').join(' ').trim();
    // Only OCR scanned pages. Avoid merging all pages into a giant canvas.
    if (text.length < 35) {
      const viewport = page.getViewport({scale:1.8});
      const scale = Math.min(1,1800/Math.max(viewport.width,viewport.height));
      const canvas = document.createElement('canvas');
      const vp = page.getViewport({scale:1.8*scale});
      canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      text = await extractTextFromImage(canvas.toDataURL('image/jpeg',.85));
      canvas.width = canvas.height = 0;
    }
    if (text.trim()) texts.push(`[Page ${i}]\n${text.trim()}`);
  }
  if (pdf.numPages > 10) showToast(`Read first 10 of ${pdf.numPages} PDF pages`);
  return texts.join('\n\n');
}
async function readAttachments(items) {
  const chunks = [];
  for (let i=0; i<items.length; i++) {
    const item = items[i];
    renderThinking(`Processing attachment ${i+1}/${items.length}: ${item.label}`);
    const text = item.type === 'pdf' ? await extractTextFromPDF(item.file) : await extractTextFromImage(item.dataUrl);
    if (text.trim()) chunks.push(`SOURCE: ${item.label}\n${text.trim()}`);
  }
  if (items.length && !chunks.length) throw new Error('No readable text in attachments. Try clearer images.');
  return chunks.join('\n\n---\n\n');
}
async function startCameraStream() {
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  cameraStream = null;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera requires HTTPS or localhost and a compatible browser.');
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraFacingMode},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const video = $('#camera-video'); video.srcObject = cameraStream;
    await video.play(); flashOn = false; updateFlashIcon();
  } catch(error) { showToast('Camera error: ' + error.message); closeCamera(); }
}
async function openCamera() { $('#camera-overlay').classList.remove('d-none'); await startCameraStream(); }
function closeCamera() {
  if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
  cameraStream = null; $('#camera-video').srcObject = null;
  $('#camera-overlay').classList.add('d-none'); flashOn = false; updateFlashIcon();
}
function updateFlashIcon() {
  $('#cam-flash i').className = flashOn ? 'bi bi-lightning-fill' : 'bi bi-lightning';
  $('#cam-flash').classList.toggle('text-warning',flashOn);
}
async function toggleFlash() {
  const track = cameraStream?.getVideoTracks()[0]; if (!track) return;
  const caps = track.getCapabilities?.() || {};
  if (!caps.torch) { showToast('Torch not supported on this camera'); return; }
  try { await track.applyConstraints({advanced:[{torch:!flashOn}]}); flashOn = !flashOn; updateFlashIcon(); }
  catch { showToast('Could not toggle torch'); }
}
async function capturePhoto() {
  const video = $('#camera-video');
  if (!video.videoWidth || !video.videoHeight) { showToast('Camera is not ready'); return; }
  const canvas = document.createElement('canvas');
  const scale = Math.min(1,1600/Math.max(video.videoWidth,video.videoHeight));
  canvas.width = Math.round(video.videoWidth*scale); canvas.height = Math.round(video.videoHeight*scale);
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  attachments.push({type:'image',dataUrl:canvas.toDataURL('image/jpeg',.85),label:cameraFacingMode==='user'?'Front Camera':'Back Camera'});
  renderAttachmentPreviews(); closeCamera();
}

function contentSafetyCheck(rows) {

const compact = text => String(text ?? '').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const words = text => String(text ?? '').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g) || [];
function keywordRevealsAnswer(keyword, answer) {
  const k = compact(keyword), a = compact(answer);
  if (!k || !a || k===a) return true;
  if (a.length>=3 && k.includes(a)) return true;
  if (k.length>=4 && a.includes(k)) return true;
  const answerWords = new Set(words(answer).filter(w=>w.length>=3));
  if (words(keyword).some(w=>answerWords.has(w))) return true;
  // Catch acronyms such as "PS5" for "PlayStation 5" or "XSX" for "Xbox Series X".
  // Split CamelCase brand names before building initials.
  const segments = String(answer).replace(/([a-z])([A-Z])/g,'$1 $2')
    .replace(/([A-Za-z])(\d)/g,'$1 $2').replace(/(\d)([A-Za-z])/g,'$1 $2');
  const parts = words(segments).filter(w=>!['the','of','and','a','an'].includes(w));
  if (parts.length >= 2) {
    const acronym = parts.map(w=>w[0]).join('');
    if (acronym.length >= 2 && (k===acronym || words(keyword).includes(acronym))) return true;
  }
  return false;
}
function questionRevealsAnswer(question, answer) {
  const aw = words(answer), qw = words(question);
  if (!aw.length) return false;
  // Match full answer as consecutive words, not arbitrary substrings inside unrelated words.
  if (aw.length===1 && aw[0].length<3) return qw.includes(aw[0]);
  for (let i=0; i<=qw.length-aw.length; i++) {
    if (aw.every((word,j)=>qw[i+j]===word)) return true;
  }
  return false;
}
// Responses from different models may be JSON, TSV, Markdown tables, or
// literal "\\t" delimiters. Normalize all of them before validating.
function normalizeAIItem(item, fallbackNumber) {
  if (Array.isArray(item)) {
    if (item.length >= 4) return [String(item[0] ?? fallbackNumber), String(item[1] ?? ''), String(item[2] ?? ''), String(item[3] ?? '')].map(s=>s.trim());
    if (item.length === 3) return [String(fallbackNumber),...item.map(x=>String(x??'').trim())];
    return null;
  }
  if (!item || typeof item !== 'object') return null;
  const num=item.number ?? item.num ?? item.index ?? item['#'] ?? fallbackNumber;
  const kw=item.keyword ?? item.key ?? item.clue ?? item.label ?? '';
  const q=item.question ?? item.fullQuestion ?? item.full_question ?? item['Full Question'] ?? '';
  const a=item.answer ?? item.correctAnswer ?? item.correct_answer ?? '';
  if (typeof q === 'object' || typeof a === 'object') return null;
  return [String(num).trim(),String(kw).trim(),String(q).trim(),String(a).trim()];
}
function decodeAIResponse(raw) {
  const text=String(raw ?? '').trim();
  if (!text) return [];
  // The preferred format is JSON. Also accept raw arrays and fenced blocks.
  const structured=parseJSON(text);
  const array=Array.isArray(structured) ? structured :
    (structured?.rows ?? structured?.items ?? structured?.questions ?? structured?.data);
  if (Array.isArray(array)) return array.map((item,i)=>normalizeAIItem(item,i+1)).filter(Boolean);
  // Fallback for a JSON array embedded in explanatory text.
  const left=text.indexOf('['),right=text.lastIndexOf(']');
  if (left>=0 && right>left) {
    try {
      const arr=JSON.parse(text.slice(left,right+1));
      if (Array.isArray(arr)) return arr.map((item,i)=>normalizeAIItem(item,i+1)).filter(Boolean);
    } catch {}
  }
  const rows=[];
  for (let line of text.split(/\r?\n/)) {
    line=line.trim();
    if (!line || /^```/.test(line)) continue;
    // Markdown pipe tables, including a leading and trailing pipe.
    if (line.startsWith('|') && line.endsWith('|')) line=line.slice(1,-1);
    let cells;
    if (line.includes('\t')) cells=line.split('\t');
    else if (line.includes('\\t')) cells=line.split(/\\t/); // model wrote literal backslash+t
    else if (line.includes('|')) cells=line.split(/\s*\|\s*/);
    else if (/^\s*\d+[.)]\s/.test(line)) {

      line=line.replace(/^(\d+)[.)]\s+/, '$1  ');

    } else continue;
    cells=cells.map(cell=>cell.trim().replace(/^\*\*(.*?)\*\*$/,'$1'));
    if (cells.length>4) cells=[cells[0],cells[1],cells.slice(2,-1).join(' '),cells.at(-1)];
    if (cells.length===4 && /^\d+$/.test(cells[0])) rows.push(cells);

function validateRows(rows,expected=24,firstNumber=1) {
  if (rows.length!==expected) return {ok:false,reason:`Expected ${expected} question/answer rows, received ${rows.length}`,rows};
  const seen=new Set();
  for (let i=0;i<expected;i++) {
    const r=rows[i];
    if (!Array.isArray(r)||r.length!==4) return {ok:false,reason:`Invalid columns at row ${i+1}`,rows};
    if (Number(r[0])!==firstNumber+i) return {ok:false,reason:`Incorrect row number at ${i+firstNumber}`,rows};
    if (!r[3] || !compact(r[3])) return {ok:false,reason:`Missing answer at row ${i+firstNumber}`,rows};
    if (seen.has(compact(r[3]))) return {ok:false,reason:`Duplicate answer: ${r[3]}`,rows};
    seen.add(compact(r[3]));
    if (i+firstNumber<=16 && !r[2]) return {ok:false,reason:`Missing question ${i+firstNumber}`,rows};
    if (i+firstNumber>=17 && (r[1].toLowerCase()!=='confuser' || r[2].toLowerCase()!=='none'))
      return {ok:false,reason:`Confuser row ${i+firstNumber} must use Confuser / None`,rows};
    if (['none','n/a','cx','confuser','placeholder'].includes(r[3].toLowerCase()))

  }

}
function parseTSV(raw) {return validateRows(decodeAIResponse(raw));}
function qualityProblems(rows) {
  const issues=[],seen=new Set();
  for (let i=0;i<16;i++) {
    const [rowNumber,key,question,answer]=rows[i];
    const kw=key.trim(),ww=kw.split(/\s+/).filter(Boolean);
    if (!kw || kw.length>15 || ww.length>2 || /[^A-Za-z0-9 -]/.test(kw)) issues.push(`Row ${rowNumber}: keyword must contain 1–2 readable words, maximum 15 characters; got "${key}".`);
    if (seen.has(compact(kw))) issues.push(`Row ${rowNumber}: duplicate keyword "${key}".`);
    seen.add(compact(kw));
    if (keywordRevealsAnswer(kw,answer)) issues.push(`Row ${rowNumber}: keyword "${kw}" reveals answer "${answer}".`);
    if (questionRevealsAnswer(question,answer)) issues.push(`Row ${rowNumber}: question contains the answer "${answer}".`);
    const wordCount=question.trim().split(/\s+/).length;
    if (wordCount<10 || wordCount>25) issues.push(`Row ${rowNumber}: question has ${wordCount} words, expected 10–25.`);

}
function parseJSON(raw) {
  const cleaned=String(raw??'').replace(/^\s*```(?:json)?\s*/i,'').replace(/\s*```\s*$/i,'').trim();
  try {return JSON.parse(cleaned);} catch {
    for (const [start,end] of [['{','}'],['[',']']]) {
      const first=cleaned.indexOf(start),last=cleaned.lastIndexOf(end);
      if (first<0 || last<=first) continue;
      try {return JSON.parse(cleaned.slice(first,last+1));} catch {}
    }
    return null;
  }
}

async function repairRowsPrompt(topic,sourceText,difficulty,previous,issues,attempt) {

async function generateFullRows(topic,sourceText,difficulty) {

async function generateBatchedRows(topic,sourceText,difficulty,previousIssues=[]) {

    let success=false,problem='';

      renderThinking(`Generating rows ${start}–${start+7} (${difficulty}; batch ${start===1?1:start===9?2:3}/3)...`);
      const prior=all.map(r=>({number:Number(r[0]),keyword:r[1],question:r[2],answer:r[3]}));
      const requirements=start===1 ? 'Create EIGHT different categories.' : start===9 ?
        'Create 8 questions related respectively to the categories in rows 1–8, each with NEW correct answers.' :
        'Create 8 tempting WRONG answer options for the preceding 16 questions, not correct answers.';
      const system=`You create high-quality educational quiz content for a 16-question, 24-answer gear wheel.
TOPIC: ${topic}. DIFFICULTY: ${DIFFICULTIES[difficulty] || DIFFICULTIES.medium}.
CONTENT RULES: Classroom-friendly, factual, unambiguous, appropriate for ages 6+. ${requirements}
Return ONLY a valid JSON object with EXACTLY EIGHT objects in its rows array, numbered ${start} through ${start+7}.
Each object uses properties: number (integer), keyword (string), question (string), answer (string).
${start < 17 ? 'Questions must be 10–25 words, with 1–2 word clue keywords (max 15 characters). The clue keyword and question must NOT reveal their own answer. Unique keyword clues; no trivial vague labels.' : 'Use keyword="Confuser", question="None" for every row, with plausible wrong alternatives as answer.'}

${sourceRequirements(sourceText)}

      const user=`Already accepted rows (do not repeat answers; preserve their categories): ${JSON.stringify(prior)}\nProduce ONLY new rows ${start}–${start+7}. ${problem ? 'Previous issue: '+problem : ''}`;
      try {
        const response=await groqChat([{role:'system',content:system},{role:'user',content:user}],true);
        ensureSufficient(response);
        const parsed=decodeAIResponse(response);
        if (parsed.length!==8) {problem=`Got ${parsed.length} rows, not 8.`;continue;}
        const numbered=parsed.map((r,i)=>[String(start+i),r[1],r[2],r[3]]);
        const checked=validateRows(numbered,8,start);
        if(!checked.ok) {problem=checked.reason;continue;}
        const combined=[...all,...numbered];
        if(new Set(combined.map(r=>compact(r[3]))).size!==combined.length) {problem='Answer repeats an earlier batch.';continue;}
        const safety=contentSafetyCheck(numbered);

}
async function reviewClues(rows,topic,sourceText,difficulty,previousIssues=[],start=0,end=16) {

  const expected=end-start;
  const system=`You are an expert quiz editor. Improve the clue keywords and question wording. Do NOT alter any locked answer.
Topic: ${topic}. Difficulty: ${DIFFICULTIES[difficulty] || DIFFICULTIES.medium}.
Output ONLY JSON: {"items":[{"number":${start+1},"key":"Sony Console","question":"Which video gaming console family introduced by Sony became popular for playing games on television?"}, ...]}.
Return EXACTLY ${expected} items numbered ${start+1} through ${end}, in order.
Rules: each clue is 1–2 natural words, max 15 characters, and must never reveal its own answer or a recognizable abbreviation/alias. Clues must be distinctive, not generic. Questions are 10–25 words, accurate, naturally written, answerable by the LOCKED answer, and must not state it. Keep the selected ${difficulty} difficulty level (do not unintentionally simplify hard questions). Do not add unverified facts. Classroom-safe content only.

  if(!Array.isArray(edited) || edited.length!==expected) return {ok:false,issues:[`Reviewer produced ${Array.isArray(edited)?edited.length:0} of ${expected} expected items`]};

  for(let i=0;i<expected;i++) {
    const item=edited[i];
    if (Number(item?.number)!==start+i+1 || typeof item.key!=='string' || typeof item.question!=='string')
      return {ok:false,issues:[`Reviewer item ${start+i+1} missing or out of order`]};

  const issues=qualityProblems(result).filter(issue=>{
    const found=issue.match(/^Row (\d+):/);
    return found && Number(found[1])>=start+1 && Number(found[1])<=end;

  issues.push(...contentSafetyCheck(result).issues.filter(x=>{
    const found=x.match(/row (\d+)/i);

}
async function improveQuiz(rows,topic,sourceText,difficulty) {
  const issues=[];

    renderThinking(`AI quality review (${attempt+1}/2): checking clues and questions...`);

      const reviewed=await reviewClues(rows,topic,sourceText,difficulty,issues);
      if(reviewed.ok) return reviewed.rows;
      issues.push(...reviewed.issues);
    } catch(error) {issues.push(error.message);}
  }
  // When an entire 16-item review is unreliable, review 8 items at a time.
  let halfReviewed=rows;
  for(const [begin,end] of [[0,8],[8,16]]) {
    let success=false;
    for(let attempt=0;attempt<3;attempt++) {
      renderThinking(`Fine-tuning clue labels ${begin+1}–${end}...`);
      try {
        const reviewed=await reviewClues(halfReviewed,topic,sourceText,difficulty,issues,begin,end);
        if(reviewed.ok) {halfReviewed=reviewed.rows;success=true;break;}
        issues.push(...reviewed.issues);
      }catch(error){issues.push(error.message);}
    }
    if(!success) {
      const originalIssues=qualityProblems(rows).concat(contentSafetyCheck(rows).issues);
      if(!originalIssues.length) {showToast('Using the validated original questions.');return rows;}

/* =================== GENERATION PIPELINE =================== */
async function generate(topic,items,difficulty) {
  const sourceText=await readAttachments(items);
  const draft=await generateFullRows(topic,sourceText,difficulty);
  const finalRows=await improveQuiz(draft,topic,sourceText,difficulty);
  const checked=validateRows(finalRows);
  if(!checked.ok) throw new Error(checked.reason);
  const problems=qualityProblems(finalRows).concat(contentSafetyCheck(finalRows).issues);
  if(problems.length) throw new Error('The final quiz failed validation: '+problems[0]);
  const innerOrder=finalRows.slice(0,16).map(row=>row[1]);
  const obj={
    qas:finalRows.slice(0,16).map(row=>({key:row[1],question:row[2],answer:row[3]})),
    innerOrder,
    outerFlags:[]
  };
  // Original arrangement: eight groups of [A answer,B answer,confuser], then one-slot shift.
  const flags=finalRows.map(row=>row[3]);
  for(let i=0;i<8;i++) {
    const positions=[i,i+8,i+16],group=positions.map(index=>flags[index]);
    for(let j=group.length-1;j>0;j--) {
      const k=Math.floor(Math.random()*(j+1));
      [group[j],group[k]]=[group[k],group[j]];
    }
    positions.forEach((position,j)=>{flags[position]=group[j];});
  }
  flags.push(flags.shift());obj.outerFlags=flags;
  clearThinking();renderTable(finalRows);renderJSON(obj);
  showToast(`Ready: ${difficulty} quiz with 16 verified clues and 24 unique answers.`);
}

  document.querySelectorAll('input[name="difficulty"]').forEach(node=>node.disabled=true);
  try {await generate(topic,items,difficulty);}
  catch(error){console.error('Generation:',error);clearThinking();renderError(error.message);}
  finally {
    generating=false;
    for(const node of ['#btn-send','#btn-attach','#btn-camera']) $(node).disabled=false;
    document.querySelectorAll('input[name="difficulty"]').forEach(node=>node.disabled=false);
  }
};
$('#input').onkeydown=event=>{
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('#btn-send').click();}
};

/* =================== GEAR PREVIEW ENGINE =================== */
let gameLoopId=null, gameCleanup=null, gameTimer=null;
function closeGame() {
  if (gameLoopId!==null) cancelAnimationFrame(gameLoopId);
  gameLoopId=null;
  if (gameCleanup) gameCleanup(); gameCleanup=null;
  if (gameTimer) clearTimeout(gameTimer); gameTimer=null;
  $('#game-overlay').classList.add('d-none');
  document.body.style.overflow='';
}
$('#game-close').onclick=closeGame;
function launchGame(data) {
  if (!data?.qas || !data?.innerOrder || !data?.outerFlags) return;
  closeGame(); $('#game-overlay').classList.remove('d-none'); document.body.style.overflow='hidden';
  initGameEngine(data);
}
function initGameEngine(data) {
  const canvas=$('#gameCanvas'),ctx=canvas.getContext('2d');
  const innerItems=data.innerOrder,outerItems=data.outerFlags;
  const qaMap=new Map(data.qas.map(item=>[item.key,{q:item.question,a:item.answer}]));
  const state={gearAngle:0,ringAngle:0,velocity:0,dragging:false,lastAngle:0,roundStarted:false};
  const RING_TEETH=24,GEAR_TEETH=16,RATIO=1.5;
  const offset=7.5*Math.PI/180;
  let w=0,h=0,minDim=0,cx=0,cy=0,geom;
  const polar=(c,r,a)=>({x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)});
  function gearPath(center,teeth,root,tip,internal) {
    const pitch=2*Math.PI/teeth,topFrac=.45;
    const base=internal?tip:root,ext=internal?root:tip;
    ctx.beginPath(); const start=polar(center,base,-pitch/2);ctx.moveTo(start.x,start.y);
    for (let i=0;i<teeth;i++) {
      const a=i*pitch,flank=pitch*(1-topFrac)/2;
      const a1=a-pitch/2,a2=a1+flank,a3=a-pitch*topFrac/2,a4=a+pitch*topFrac/2,a5=a+pitch/2-flank;
      ctx.arc(center.x,center.y,base,a1,a2);
      const control1=polar(center,(base+ext)/2,a2),p1=polar(center,ext,a3);
      ctx.quadraticCurveTo(control1.x,control1.y,p1.x,p1.y);
      ctx.arc(center.x,center.y,ext,a3,a4);
      const control2=polar(center,(base+ext)/2,a5),p2=polar(center,base,a5);
      ctx.quadraticCurveTo(control2.x,control2.y,p2.x,p2.y);
    }
    ctx.closePath();
  }
  function resize() {
    w=window.innerWidth;h=window.innerHeight;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    minDim=Math.min(w,h);cx=w/2;cy=h/2;
    const ringR=minDim*.42,toothH=minDim*.05;
    const pitch=ringR-minDim*.07-toothH/2;
    const gearRoot=pitch*2/3-toothH/2;
    geom={ringOuter:ringR,ringRoot:ringR-minDim*.07,ringTip:ringR-minDim*.07-toothH,
      gearRoot,gearTip:gearRoot+toothH,
      gearCenter:{x:cx+(pitch/3)*Math.cos(10*Math.PI/180),y:cy+(pitch/3)*Math.sin(10*Math.PI/180)}};
    positionFlags();updateGameUI();
  }
  function render() {
    ctx.clearRect(0,0,w,h);
    ctx.save();ctx.translate(cx,cy);
    ctx.beginPath();ctx.arc(0,0,geom.ringOuter,0,Math.PI*2);ctx.arc(0,0,geom.ringRoot,0,Math.PI*2,true);
    ctx.fillStyle='#0d6efd';ctx.fill();
    ctx.rotate(state.ringAngle+15*Math.PI/180);
    ctx.fillStyle='#0a58ca';ctx.beginPath();ctx.arc(0,0,geom.ringRoot,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3d8bfd';gearPath({x:0,y:0},RING_TEETH,geom.ringRoot,geom.ringTip,true);ctx.fill();
    ctx.strokeStyle='#ffffff33';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(geom.gearCenter.x,geom.gearCenter.y);ctx.rotate(state.gearAngle);
    ctx.shadowColor='#0005';ctx.shadowBlur=15;
    const grad=ctx.createRadialGradient(0,0,geom.gearRoot*.2,0,0,geom.gearTip);
    grad.addColorStop(0,'#ffc107');grad.addColorStop(1,'#fd7e14');
    ctx.fillStyle=grad;gearPath({x:0,y:0},GEAR_TEETH,geom.gearRoot,geom.gearTip,false);ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';
    ctx.font=`bold ${Math.max(9,Math.min(14,minDim*.025))}px sans-serif`;
    const r=geom.gearRoot*.75,step=2*Math.PI/GEAR_TEETH;
    innerItems.forEach((label,i)=>{
      ctx.save();const theta=i*step;ctx.rotate(theta);ctx.translate(r,0);
      const angle=((state.gearAngle+theta)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      if (angle>Math.PI/2 && angle<3*Math.PI/2) ctx.rotate(Math.PI);
      ctx.fillText(label,0,0,Math.max(20,geom.gearRoot*.75));ctx.restore();
    });
    ctx.restore();
  }
  function countryCode(flag) {
    const cps=[...flag].map(x=>x.codePointAt(0));
    const letters=cps.filter(cp=>cp>=0x1f1e6&&cp<=0x1f1ff).map(cp=>String.fromCharCode(cp-0x1f1e6+65));
    return letters.length===2 ? letters.join('').toLowerCase() : null;
  }
  const flagContainer=$('#game-flags-container');flagContainer.replaceChildren();
  outerItems.forEach(answer=>{
    const node=document.createElement('div');node.className='flag-pill';
    const code=countryCode(answer);
    if (code) { const img=document.createElement('img');img.src=`https://flagcdn.com/w40/${code}.png`;img.alt=answer;img.style.width='20px';node.appendChild(img); }
    else node.textContent=answer;
    flagContainer.appendChild(node);
  });
  function positionFlags() {
    if (!geom) return;
    const step=2*Math.PI/RING_TEETH,phase=state.ringAngle+step/2+offset;
    Array.from(flagContainer.children).forEach((el,i)=>{
      const theta=i*step+phase;
      const norm=Math.atan2(Math.sin(theta),Math.cos(theta));
      const ratio=Math.max(0,1-Math.abs(norm)/(step*2.5));
      const r=geom.ringOuter+minDim*.025+(minDim*.01+1)*ratio;
      const x=cx+r*Math.cos(theta),y=cy+r*Math.sin(theta);
      el.style.left=x+'px';el.style.top=y+'px';
      el.style.transform=`translate(${-50+Math.cos(theta)*50*ratio}%,${-50+Math.sin(theta)*50*ratio}%) scale(${1+.5*ratio})`;
      el.style.zIndex=ratio>.1?'20':'10';
    });
  }
  function updateGameUI() {
    if (!geom) return;
    const step=2*Math.PI/GEAR_TEETH;
    let idx=Math.round(-state.gearAngle/step)%GEAR_TEETH;if(idx<0) idx+=GEAR_TEETH;
    const entry=qaMap.get(innerItems[idx]);
    $('#game-q-text').textContent=entry?.q||'Rotate to align a question...';
    $('#game-a-text').classList.toggle('d-none',!entry);
    $('#game-a-value').textContent=entry?.a||'';
    const box=$('#game-selection-box');box.classList.remove('d-none');
    const startX=geom.gearCenter.x+geom.gearRoot*.75-50;
    const endX=cx+geom.ringOuter+minDim*.025+minDim*.08+50;
    box.style.left=startX+'px';box.style.width=Math.max(15,endX-startX)+'px';
    box.style.top=(geom.gearCenter.y+cy)/2-25+'px';box.style.height='50px';
    box.style.zIndex='50';
  }
  function setRing(angle) {state.ringAngle=angle;state.gearAngle=angle*RATIO;positionFlags();updateGameUI();}
  function getAngle(event) {return Math.atan2(event.clientY-cy,event.clientX-cx);}
  const onPointerDown=event=>{state.dragging=true;state.lastAngle=getAngle(event);state.velocity=0;canvas.setPointerCapture(event.pointerId);};
  const onPointerMove=event=>{
    if (!state.dragging) return;
    const angle=getAngle(event);let delta=angle-state.lastAngle;
    if(delta>Math.PI)delta-=2*Math.PI;if(delta< -Math.PI)delta+=2*Math.PI;
    setRing(state.ringAngle+delta);state.lastAngle=angle;state.velocity=delta;
  };
  const onPointerUp=()=>{state.dragging=false;};
  const onKeyDown=event=>{
    if ($('#game-overlay').classList.contains('d-none')) return;
    if(event.key==='Escape'){closeGame();return;}
    if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
      event.preventDefault();state.velocity=0;setRing(state.ringAngle+(event.key==='ArrowRight'?.05:-.05));
    }
    if(event.key.toLowerCase()==='s'||event.key==='Enter'){
      event.preventDefault();state.roundStarted=!state.roundStarted;
      flagContainer.classList.toggle('opacity-0',!state.roundStarted);
      $('#game-hint-box').style.opacity=state.roundStarted?'0':'1';
      if (!state.roundStarted) {
        const overlay=$('#game-result-overlay');overlay.classList.remove('d-none');overlay.classList.add('d-flex');
        if(gameTimer) clearTimeout(gameTimer);
        gameTimer=setTimeout(()=>{overlay.classList.add('d-none');overlay.classList.remove('d-flex');},1500);
      }
    }
  };
  canvas.addEventListener('pointerdown',onPointerDown);
  canvas.addEventListener('pointermove',onPointerMove);
  canvas.addEventListener('pointerup',onPointerUp);
  canvas.addEventListener('pointercancel',onPointerUp);
  document.addEventListener('keydown',onKeyDown);
  window.addEventListener('resize',resize);
  gameCleanup=()=>{
    canvas.removeEventListener('pointerdown',onPointerDown);
    canvas.removeEventListener('pointermove',onPointerMove);
    canvas.removeEventListener('pointerup',onPointerUp);
    canvas.removeEventListener('pointercancel',onPointerUp);
    document.removeEventListener('keydown',onKeyDown);
    window.removeEventListener('resize',resize);
    $('#game-result-overlay').classList.add('d-none');$('#game-result-overlay').classList.remove('d-flex');
    flagContainer.classList.add('opacity-0');$('#game-hint-box').style.opacity='1';
  };
  function loop(){
    if(!state.dragging&&Math.abs(state.velocity)>.001){state.velocity*=.95;setRing(state.ringAngle+state.velocity);}
    render();gameLoopId=requestAnimationFrame(loop);
  }
  resize();loop();
}

/* =================== SETTINGS / STARTUP =================== */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-bs-theme',theme);
  $('#btn-theme i').className=theme==='dark'?'bi bi-sun-fill':'bi bi-moon-stars-fill';
}
try {if(localStorage.getItem('theme')==='dark')applyTheme('dark');} catch {}
$('#btn-theme').onclick=()=>{
  const next=document.documentElement.getAttribute('data-bs-theme')==='dark'?'light':'dark';
  applyTheme(next);try{localStorage.setItem('theme',next);}catch{}
};
$('#btn-clear-storage').onclick=()=>{
  if(window.location.port==='5173'){
    if(confirm('Clear saved custom game data?')){localStorage.removeItem(STORAGE_KEY);showToast('Saved game override cleared');}
  }else{
    showToast('Clear game data from the SAME origin/port as the main game.');
    if(confirm('Open the main game port 5173 to clear storage?'))window.open('http://localhost:5173#clear','_blank');
  }
};
renderUser('Type a topic or attach images/PDF notes to create your quiz.');
</script>
